<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.name">AI Token League</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell public-shell">
      <section class="masthead public-masthead">
        <div class="masthead-copy">
          <div class="brand-row">
            <h1 data-i18n="app.name">AI Token League</h1>
            <span id="board-identity-eyebrow" class="pill" data-i18n="web.publicBoard">Public community board</span>
          </div>
        </div>
        <div class="masthead-side">
          <nav class="public-nav" aria-label="Site">
            <a href="/" class="nav-link" data-i18n="web.nav.home">Home</a>
            <a href="/leaderboard.html" class="nav-link current" data-i18n="web.nav.leaderboard">Leaderboard</a>
            <a href="/analytics.html" class="nav-link" data-i18n="web.nav.analytics">Analytics</a>
            <a href="/profile.html" class="nav-link" id="nav-profile-link" data-i18n="web.nav.profile">Profile</a>
          </nav>
          <div class="lang-switcher-container" id="lang-switcher-container"></div>
        </div>
      </section>

      <section class="toolbar period-toolbar" aria-label="Leaderboard period">
        <div class="period-pills" data-filter="period">
          <button data-value="today" class="active" data-i18n="web.period.today">Today</button>
          <button data-value="yesterday" data-i18n="web.period.yesterday">Yesterday</button>
          <button data-value="this_week" data-i18n="web.period.thisWeek">This week</button>
          <button data-value="last_week" data-i18n="web.period.lastWeek">Last week</button>
          <button data-value="this_month" data-i18n="web.period.thisMonth">This month</button>
          <button data-value="last_month" data-i18n="web.period.lastMonth">Last month</button>
          <button data-value="all" data-i18n="web.period.all">All</button>
        </div>
        <div class="toolbar-right">
          <select id="source-filter" class="source-filter-select" data-i18n-aria-label="web.leaderboard.sourceFilter">
            <option value="" data-i18n="web.leaderboard.allSources">All sources</option>
          </select>
          <div class="view-segments" data-view-mode>
            <button data-value="meter" class="active" data-i18n="web.viewMeter">Meter</button>
            <button data-value="list" data-i18n="web.viewList">List</button>
          </div>
          <label class="inline-toggle subtle-toggle">
            <input id="show-cost" type="checkbox" />
            <span data-i18n="web.estimatedCost">Estimated cost</span>
          </label>
          <span id="status" class="leaderboard-status" aria-live="polite" data-i18n="loading">Loading...</span>
        </div>
      </section>

      <section class="board motion-surface" id="leaderboard-surface" aria-busy="true">
        <div id="top-three" class="top-three-grid"></div>
        <div id="meter-view" class="meter-stack"></div>
        <div id="list-view" class="table-wrap" hidden>
          <table class="public-table">
            <thead>
              <tr>
                <th data-i18n="web.leaderboard.rank">Rank</th>
                <th id="col-name" data-i18n="web.leaderboard.colNickname">Nickname</th>
                <th data-i18n="web.leaderboard.totalTokens">Total tokens</th>
                <th data-i18n="web.leaderboard.contribution">Contribution</th>
                <th class="cost-col" hidden data-i18n="web.leaderboard.estCost">Est. cost</th>
                <th data-i18n="web.leaderboard.models">Models</th>
              </tr>
            </thead>
            <tbody id="leaderboard"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/leaderboard.js"></script>
  </body>
</html>
