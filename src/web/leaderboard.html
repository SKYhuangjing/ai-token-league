<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.name">AI Token League</title>
    <script>
      (() => {
        try {
          const lang = localStorage.getItem("ai-token-league.language");
          if (lang === "en" || lang === "zh-CN") document.documentElement.lang = lang;
          document.documentElement.dataset.bootLang = document.documentElement.lang;
        } catch (_) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="prefetch" href="/" />
    <link rel="prefetch" href="/leaderboard.html" />
    <link rel="prefetch" href="/analytics.html" />
    <link rel="prefetch" href="/profile.html" />

  </head>
  <body>
    <main class="shell public-shell">
      <section class="masthead public-masthead">
        <div class="masthead-copy">
          <div class="brand-row">
            <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m8 5-6 7 6 7m8-14 6 7-6 7M14 3l-4 18"/></svg></div>
            <h1 data-i18n="app.name">AI Token League</h1>
            <span id="board-identity-eyebrow" class="pill" data-i18n="web.publicBoard">匿名社区榜单</span>
          </div>
        </div>
        <div class="masthead-side">
          <nav class="public-nav" aria-label="Site">
            <a href="/" class="nav-link" data-i18n="web.nav.home">首页</a>
            <a href="/leaderboard.html" class="nav-link current" data-i18n="web.nav.leaderboard">排行榜</a>
            <a href="/analytics.html" class="nav-link" data-i18n="web.nav.analytics">分析</a>
            <a href="/profile.html" class="nav-link" id="nav-profile-link" data-i18n="web.nav.profile">个人</a>
          </nav>
          <div class="lang-switcher-container" id="lang-switcher-container">
            <div class="lang-switcher" id="lang-switcher" role="group" aria-label="Language">
              <button type="button" class="lang-opt" data-lang="zh-CN" aria-pressed="true">中文</button>
              <button type="button" class="lang-opt" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </div>
      </section>

      <section class="toolbar period-toolbar" aria-label="Leaderboard period">
        <div class="period-pills" data-filter="period">
          <button data-value="today" class="active" data-i18n="web.period.today">今天</button>
          <button data-value="yesterday" data-i18n="web.period.yesterday">昨天</button>
          <button data-value="this_week" data-i18n="web.period.thisWeek">本周</button>
          <button data-value="last_week" data-i18n="web.period.lastWeek">上周</button>
          <button data-value="this_month" data-i18n="web.period.thisMonth">本月</button>
          <button data-value="last_month" data-i18n="web.period.lastMonth">上月</button>
          <button data-value="all" data-i18n="web.period.all">全部</button>
        </div>
        <div class="toolbar-right">
          <span class="console-period-label" id="leaderboard-period-label" aria-live="polite"></span>
          <select id="source-filter" class="source-filter-select" data-i18n-aria-label="web.leaderboard.sourceFilter">
            <option value="" data-i18n="web.leaderboard.allSources">All sources</option>
          </select>
          <div class="view-segments" data-view-mode>
            <button data-value="meter" class="active" data-i18n="web.viewMeter">Meter</button>
            <button data-value="list" data-i18n="web.viewList">List</button>
          </div>
          <label class="inline-toggle subtle-toggle">
            <input id="show-cost" type="checkbox" />
            <span data-i18n="web.estimatedCost">Estimated cost</span>
          </label>
          <span id="status" class="leaderboard-status" aria-live="polite" data-i18n="loading">Loading...</span>
        </div>
      </section>

      <section class="board motion-surface" id="leaderboard-surface" aria-busy="true">
        <div id="top-three" class="top-three-grid"></div>
        <div id="meter-view" class="meter-stack"></div>
        <div id="list-view" class="table-wrap" hidden>
          <table class="public-table">
            <thead>
              <tr>
                <th data-i18n="web.leaderboard.rank">Rank</th>
                <th id="col-name" data-i18n="web.leaderboard.colNickname">Nickname</th>
                <th data-i18n="web.leaderboard.totalTokens">Total tokens</th>
                <th data-i18n="web.leaderboard.contribution">Contribution</th>
                <th class="cost-col" hidden data-i18n="web.leaderboard.estCost">Est. cost</th>
                <th data-i18n="web.leaderboard.models">Models</th>
              </tr>
            </thead>
            <tbody id="leaderboard"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module" src="/leaderboard.js"></script>
  </body>
</html>
