services:
  backend:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: ai-token-league-backend
    env_file:
      - ${ENV_FILE:-env.local}
    ports:
      - "${HOST_PORT:-8787}:8787"
