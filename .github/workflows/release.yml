name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.6.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_body: ${{ steps.release-body.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          node scripts/check-release-version.js --tag "$TAG"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: |
          node --check src/desktop/tauri-bridge.js
          node --check src/desktop/renderer.js
          node --check src/shared/update.js
          node --check scripts/build-github-tauri-update-json.js
          node --check scripts/build-release-body.js
          node --check scripts/check-release-version.js
          node --check scripts/prepare-github-release.js
          node --check scripts/upload-github-release-asset.js
      - id: release-body
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-release-body.js --version "${{ steps.meta.outputs.version }}" > release-body.md
          {
            echo "release_body<<EOF"
            cat release-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace

  build:
    needs:
      - validate
      - prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            native_cli_package: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            native_cli_package: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            native_cli_package: "@tauri-apps/cli-win32-x64-msvc@2.11.1"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            native_cli_package: "@tauri-apps/cli-linux-x64-gnu@2.11.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Install platform Tauri CLI native package
        if: matrix.native_cli_package != ''
        run: npm install --no-save ${{ matrix.native_cli_package }}
      - run: npm run preset
      - name: Build bundled Rust collector sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p atl-collector --target "${{ matrix.target }}"
          mkdir -p src-tauri/binaries
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/atl-collector.exe" "src-tauri/binaries/atl-collector.exe"
          else
            cp "target/${{ matrix.target }}/release/atl-collector" "src-tauri/binaries/atl-collector"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseName: AI Token League ${{ needs.validate.outputs.version }}
          releaseBody: ${{ needs.validate.outputs.release_body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          assetNamePattern: "AI Token League_[version]_[platform]_[arch][setup][ext]"
          args: ${{ matrix.args }}

  prepare-release:
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node scripts/build-release-body.js --version "$RELEASE_VERSION" > release-body.md
          node scripts/prepare-github-release.js \
            --repo "$REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION" \
            --target "$(git rev-parse HEAD)" \
            --body-file release-body.md

  publish:
    needs:
      - validate
      - prepare-release
      - build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build merged updater JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/build-github-tauri-update-json.js \
            --repo "${{ github.repository }}" \
            --release-id "${{ needs.prepare-release.outputs.release_id }}" \
            --tag "${{ needs.validate.outputs.tag }}" \
            --output latest.json
      - name: Upload merged updater JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/upload-github-release-asset.js \
            --repo "${{ github.repository }}" \
            --release-id "${{ needs.prepare-release.outputs.release_id }}" \
            --file latest.json \
            --name latest.json \
            --clobber
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/${{ needs.prepare-release.outputs.release_id }}" --jq '.assets[].name' | tee assets.txt
          grep -q '^latest.json$' assets.txt
          grep -q '\.app\.tar\.gz$' assets.txt
          grep -q -- '-setup\.exe$' assets.txt
          grep -q '\.dmg$' assets.txt
          grep -q '\.AppImage$' assets.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-release-body.js --version "${{ needs.validate.outputs.version }}" > release-body.md
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.prepare-release.outputs.release_id }}" \
            -F draft=false \
            -F prerelease=false \
            -f name="AI Token League ${{ needs.validate.outputs.version }}" \
            -f body="$(cat release-body.md)" \
            -f make_latest=true
