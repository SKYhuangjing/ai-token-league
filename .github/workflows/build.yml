name: Build CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test --workspace

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            native_cli_package: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            native_cli_package: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            native_cli_package: "@tauri-apps/cli-win32-x64-msvc@2.11.1"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            native_cli_package: "@tauri-apps/cli-linux-x64-gnu@2.11.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Install platform Tauri CLI native package
        if: matrix.native_cli_package != ''
        run: npm install --no-save ${{ matrix.native_cli_package }}
      - run: npm run preset
      - name: Build bundled Rust collector sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p atl-collector --target "${{ matrix.target }}"
          mkdir -p src-tauri/binaries
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/atl-collector.exe" "src-tauri/binaries/atl-collector.exe"
          else
            cp "target/${{ matrix.target }}/release/atl-collector" "src-tauri/binaries/atl-collector"
          fi
      - name: Build desktop bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}
