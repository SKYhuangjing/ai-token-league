appId: com.ai.token.league
productName: AI Token League
files:
  - src/**/*
  - "!src/backend/**"
  - "!src/web/**"
  - assets/**/*
  - package.json
  - README.md
  - "!doc/**"
  - "!tests/**"
  - "!samples/**"
  - "!scripts/**"
  - "!migrations/**"
  - "!data/**"
  - "!dist/**"
  - "!dist-installer/**"
  - "!.tmp*"
  - "!Dockerfile"
  - "!docker-compose*"
  - "!AGENTS.md"
  - "!env.*"
  - "!*.pid"
  - "!*.log"
directories:
  output: dist-installer
mac:
  icon: assets/app-icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: "${productName}-${version}-mac-${arch}-installer.${ext}"
win:
  icon: assets/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: "${productName}-${version}-win-x64-installer.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
