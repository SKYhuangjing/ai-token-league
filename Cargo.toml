[workspace]
resolver = "2"
members = ["collector-core", "atl-collector", "src-tauri"]

[workspace.package]
version = "0.7.2"
edition = "2021"
authors = ["Sky"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "fs", "rt-multi-thread", "io-util"] }
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.34", features = ["bundled"] }
walkdir = "2"
base64 = "0.22"
urlencoding = "2"
clap = { version = "4", features = ["derive"] }
regex = "1"

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
